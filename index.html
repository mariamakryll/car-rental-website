<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#667eea" />
    <meta
      name="description"
      content="Car rental website - find and book your perfect car"
    />
    <title>Car Rental Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        padding: 0;
      }
      .hero-section {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 80px 20px;
        text-align: center;
      }
      .hero-section h1 {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 20px;
      }
      .hero-section p {
        font-size: 1.2rem;
        opacity: 0.9;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      .car-card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transition: transform 0.2s, box-shadow 0.2s;
        margin-bottom: 30px;
      }
      .car-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      }
      .car-image {
        height: 200px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 3rem;
      }
      .car-details {
        padding: 20px;
      }
      .car-title {
        font-size: 1.5rem;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
      }
      .car-price {
        font-size: 1.25rem;
        color: #667eea;
        font-weight: bold;
        margin-bottom: 15px;
      }
      .car-features {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 20px;
      }
      .btn-book {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 25px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        transition: transform 0.2s;
      }
      .btn-book:hover {
        transform: scale(1.05);
      }
      .navbar {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 15px 0;
      }
      .navbar-brand {
        color: white !important;
        font-weight: bold;
        font-size: 1.5rem;
      }
      .nav-link {
        color: white !important;
        margin: 0 10px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a class="navbar-brand">🚗 Car Rental</a>
        <div>
          <a class="nav-link">Home</a>
          <a class="nav-link">Cars</a>
          <a class="nav-link">Contact</a>
        </div>
      </div>
    </nav>
    
    <div class="hero-section">
      <h1>Find Your Perfect Car</h1>
      <p>Premium car rental service at affordable prices</p>
    </div>
    
    <div class="container">
      <div class="row">
        <div class="col-md-4">
          <div class="car-card">
            <div class="car-image">🚗</div>
            <div class="car-details">
              <h3 class="car-title">Economy Car</h3>
              <p class="car-price">$35/day</p>
              <p class="car-features">5 seats • Automatic • A/C</p>
              <button class="btn-book">Book Now</button>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="car-card">
            <div class="car-image">🚙</div>
            <div class="car-details">
              <h3 class="car-title">SUV</h3>
              <p class="car-price">$55/day</p>
              <p class="car-features">7 seats • Automatic • A/C</p>
              <button class="btn-book">Book Now</button>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="car-card">
            <div class="car-image">🏎️</div>
            <div class="car-details">
              <h3 class="car-title">Luxury Car</h3>
              <p class="car-price">$85/day</p>
              <p class="car-features">4 seats • Automatic • Premium</p>
              <button class="btn-book">Book Now</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
